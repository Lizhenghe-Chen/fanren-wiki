name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 官方发布链路（需要在仓库 Settings → Pages → Source 选 GitHub Actions）
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 部署前把页面上的「最后更新 / 提交说明」刷成本次提交（dev/tools/stamp.mjs）：
      # 只改 runner 工作区里的 public/index.html，不进 git；锚点对不上就报错退出，不静默放过。
      - name: 刷新首页最后更新时间
        run: node dev/tools/stamp.mjs --write
      # 只上传 public/：dev/ 里的开发资料（Agent.md / _backup / 自检截图 / 备用素材）永远不上站
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
