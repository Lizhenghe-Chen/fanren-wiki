name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 官方发布链路（需要在仓库 Settings → Pages → Source 选 GitHub Actions）
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 只上传 public/：dev/ 里的开发资料（Agent.md / _backup / 自检截图 / 备用素材）永远不上站
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
